[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipad-cli"
version = "0.1.0"
description = "Local Appium observation and control for physical iPads"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ipad = "ipad_cli.cli:main"

[tool.setuptools.packages.find]
include = ["ipad_cli*"]
